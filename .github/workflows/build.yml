name: build
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Iskra.slnx
      - name: Build
        run: dotnet build Iskra.slnx -c Release --no-restore
      - name: Test (поиск и ранжирование)
        run: dotnet test tests/Iskra.Core.Tests -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/tests.trx'
          retention-days: 3

  desktop:
    # Проверка на живой Windows: применяем темы, снимаем рабочий стол и Проводник.
    needs: test
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: dotnet publish src/Iskra.App -c Release -r win-x64 --self-contained -o publish
      - name: Desktop screenshots per theme
        shell: pwsh
        run: ./tools/ci/desktop-shots.ps1 -Exe publish\Iskra.exe -Out desktop-shots
      - name: Iskra log
        if: always()
        shell: pwsh
        run: Get-Content "$env:LOCALAPPDATA\Iskra\iskra.log" -Tail 80 -ErrorAction SilentlyContinue
      - name: Push screenshots to branch desktop-shots
        # Хранилище артефактов может быть переполнено — кладём снимки в отдельную ветку (без запуска CI).
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        shell: pwsh
        run: |
          git config user.name "iskra-ci"; git config user.email "ci@users.noreply.github.com"
          git switch --orphan desktop-shots
          git rm -rf --cached . *> $null
          Get-ChildItem -Force | Where-Object { $_.Name -notin '.git','desktop-shots' } | Remove-Item -Recurse -Force
          git add desktop-shots
          git commit -m "desktop screenshots ${{ github.sha }} [skip ci]"
          git push -f origin desktop-shots

  package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          if ($v -match '^v\d') { $v = $v.Substring(1) } else { $v = "1.2.0" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Publish (self-contained win-x64)
        run: dotnet publish src/Iskra.App -c Release -r win-x64 --self-contained -o publish /p:Version=${{ steps.ver.outputs.version }}
      - name: Render theme screenshots (live WPF)
        continue-on-error: true
        shell: pwsh
        run: dotnet run --project tools/ThemeShots -c Release -- screens
      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $stage = "stage/Iskra"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item publish/Iskra.exe $stage/
          if (Test-Path publish/Fonts/licenses) { Copy-Item publish/Fonts/licenses $stage/licenses -Recurse }
          if (Test-Path THIRD-PARTY-NOTICES.md) { Copy-Item THIRD-PARTY-NOTICES.md $stage/ }
          Compress-Archive -Path stage/Iskra -DestinationPath "dist/Iskra-Portable-${{ steps.ver.outputs.version }}.zip" -Force
      - name: Inno Setup installer (per-user, no admin)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} /DSourceDir=..\publish installer/iskra.iss
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item installer/output/*.exe dist/ -ErrorAction SilentlyContinue
      - name: Upload artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: iskra-${{ steps.ver.outputs.version }}
          path: |
            dist/*.zip
            dist/*.exe
            screens/*.png
          retention-days: 3
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
          generate_release_notes: true
      - name: Publish latest installer release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "latest"
          $assets = @(Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.zip' })
          if ($assets.Count -eq 0) { throw "No installer or portable archive was built." }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            foreach ($asset in $assets) {
              gh release upload $tag $asset.FullName --clobber
              if ($LASTEXITCODE -ne 0) { throw "Could not upload $($asset.Name) to release $tag." }
            }
          } else {
            $files = @($assets | ForEach-Object { $_.FullName })
            gh release create $tag $files --target $env:GITHUB_SHA --title "Искра — последняя сборка (1.2.0)" --notes "Сборка из актуального main. Включает последние изменения проекта."
            if ($LASTEXITCODE -ne 0) { throw "Could not create GitHub Release $tag." }
          }
